services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: applytrack
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6381:6379"

volumes:
  pgdata: